name: Refresh news feed

on:
  # Primary trigger is cron-job.org → POST workflow_dispatch every 5 min.
  # The schedule below is a once-per-hour safety net if that pinger ever
  # falls over or its PAT expires. GH Actions cron is best-effort and
  # unreliable on free tier, which is why we don't depend on it.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: news-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch news
        run: python scan/fetch_news.py

      - name: Fetch stock prices for tagged tickers
        run: python scan/fetch_stocks.py
        continue-on-error: true

      # The market strip on every regime-desk tab (Q65 = a, 2026-10-14):
      # ten quotes, two Yahoo requests, every refresh.
      - name: Market strip
        run: python scan/fetch_indices.py
        continue-on-error: true

      # Universe-wide unusual moves for regime-desk's News tab ("Why it
      # moved"). Skips itself unless movers.json is over 30 minutes old.
      - name: Unusual moves across the universe
        run: python scan/fetch_movers.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "news-desk-bot"
          git config user.email "bot@news-desk"
          git add docs/data/headlines.json docs/data/stocks.json docs/data/movers.json docs/data/quote_types.json docs/data/indices.json
          git diff --cached --quiet && echo "No new headlines" || \
            git commit -m "chore: refresh feed $(date -u +%Y-%m-%dT%H:%MZ)"
          # Two refreshes can overlap (pinger + schedule). Every data file is
          # regenerated whole, so on a conflict the newer run's copy wins
          # (-X theirs = the commit being replayed, i.e. this run). Before
          # 2026-10-13 a conflict silently dropped this run's data.
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --rebase -X theirs origin main; } || true
          git push || true
