services:
  - type: web
    name: news-desk-refresher
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt -r worker/requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 600 worker.app:app
    healthCheckPath: /health
    envVars:
      - key: GH_PAT
        sync: false
      - key: REFRESH_INTERVAL_SECONDS
        value: "300"
      - key: PYTHONUNBUFFERED
        value: "1"
