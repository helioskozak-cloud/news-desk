<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEWS-DESK · TERMINAL</title>
<!-- Favicon: a red headline over grey body text. Inline SVG data URI so it
     costs no request and cannot 404. One bold shape in one strong colour —
     at 16px in a tab strip colour is what you actually recognise, and each
     site in the suite gets its own (PAPA amber, regime-desk blue). -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Crect x='5.5' y='6.5' width='21' height='5' rx='1.5' fill='%23f85149'/%3E%3Cg fill='%238b949e'%3E%3Crect x='5.5' y='14.5' width='21' height='3' rx='1.5'/%3E%3Crect x='5.5' y='19.5' width='21' height='3' rx='1.5'/%3E%3Crect x='5.5' y='24.5' width='12' height='3' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<style>
  /* Holdings tab — file uploader + parsed-tickers display */
  .holdings-panel{padding:18px 16px;color:var(--text);font-family:'IBM Plex Sans',sans-serif}
  .holdings-panel h2{font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;font-size:14px;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
  .holdings-panel p.lead{color:var(--muted);font-size:12px;line-height:1.55;max-width:700px;margin-bottom:14px}
  .drop-zone{border:2px dashed var(--border-bright);background:#0a0a0a;padding:32px;text-align:center;cursor:pointer;border-radius:6px;transition:border-color .15s,background .15s;margin-bottom:14px}
  .drop-zone:hover, .drop-zone.dragover{border-color:var(--amber);background:#0f0c05}
  .drop-zone .big{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--amber);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
  .drop-zone .sml{color:var(--muted);font-size:11px}
  .drop-zone input[type=file]{display:none}
  .parse-result{background:#0a0a0a;border:1px solid var(--border);padding:12px 14px;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text)}
  .parse-result .ok{color:var(--green)}
  .parse-result .warn{color:var(--amber)}
  .parse-result .err{color:var(--red)}
  .parse-result .row{display:flex;justify-content:space-between;align-items:center;padding:2px 0}
  .parse-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .parse-actions button{background:#000;border:1px solid var(--border-bright);color:var(--text);padding:5px 11px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .parse-actions button.primary{background:var(--amber);color:#000;border-color:var(--amber);font-weight:700}
  .parse-actions button:hover{border-color:var(--amber)}
  .ticker-grid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px;max-height:300px;overflow-y:auto;background:#0a0a0a;border:1px solid var(--border);padding:10px;border-radius:6px}
  .ticker-grid .pill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber);border:1px solid #5a3a00;padding:3px 6px;text-align:center;background:#000}
  :root {
    --bg:#000;
    --panel:#0a0a0a;
    --row:#0f0f0f;
    --row-alt:#131313;
    --border:#1f1f1f;
    --border-bright:#2a2a2a;
    --text:#d4d4d4;
    --bright:#fff;
    --muted:#6b6b6b;
    --dim:#3a3a3a;
    --amber:#ff9b00;
    --amber-soft:#ff9b0033;
    --cyan:#00d4ff;
    --green:#00ff7f;
    --red:#ff3b3b;
    --magenta:#ff5cc8;
    --blue:#5fa8ff;
    --yellow:#ffd84d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,sans-serif;font-size:13px;line-height:1.4;overflow-x:hidden}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:#000}
  ::-webkit-scrollbar-thumb{background:var(--border-bright);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:#404040}
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ── Top bar (function-key style) ─────────────────────────── */
  .topbar{position:sticky;top:0;z-index:100;background:#000;border-bottom:1px solid var(--amber);padding:6px 12px;display:flex;align-items:center;gap:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;flex-wrap:wrap}
  .topbar .brand{color:var(--amber);font-weight:700;letter-spacing:.15em;font-size:13px}
  /* ?embed=1 — see the script just after <body>. Hides only the brand bar so
     this page can sit inside regime-desk's News tab without two stacked
     headers; the tabs and toolbar below it stay. */
  body.nd-embed .topbar{display:none}

  /* Embedded, the greys become regime-desk's. Standalone news-desk keeps its
     own black terminal palette — this only applies inside the frame.
     news-desk's greys are neutral (#000 → #6b6b6b); regime-desk's are
     GitHub-dark, which is blue-tinted and a step lighter. Side by side in one
     page the neutral set reads as a dead patch rather than a different panel.
     Redefined on body rather than :root so the override wins by specificity
     while still inheriting everywhere inside.
     The accents (amber, cyan, green, red) are deliberately untouched — those
     are news-desk's identity, and the ask was the greys. */
  body.nd-embed{
    --bg:#0d1117;
    --panel:#161b22;
    --row:#161b22;
    --row-alt:#1c2129;
    --border:#21262d;
    --border-bright:#30363d;
    --text:#c9d1d9;
    --bright:#f0f6fc;
    --muted:#8b949e;
    --dim:#6e7681;
  }
  /* Not everything reads the variables — these hardcode black, so remapping
     the palette alone would leave them as dark patches against the new greys.
     Scoped to .nd-embed, so standalone news-desk is unaffected. */
  body.nd-embed ::-webkit-scrollbar-track{background:var(--bg)}
  body.nd-embed .tab.active{background:var(--panel)}
  body.nd-embed .toolbar input,
  body.nd-embed .toolbar select{background:var(--bg)}
  body.nd-embed .grp{background:var(--bg)}
  body.nd-embed .drop-zone,
  body.nd-embed .parse-result{background:var(--panel)}
  body.nd-embed .parse-actions button{background:var(--bg)}
  /* The MY BOOK panel builds some of its chrome with inline styles, which beat
     any class selector — hence the attribute match and !important. Matching on
     the literal colour rather than adding classes keeps this to one place
     instead of touching the renderers, which is the right trade for a
     cosmetic override that only applies inside the frame. */
  body.nd-embed [style*="background:#000"]{background:var(--bg)!important}
  body.nd-embed [style*="background:#0a0a0a"]{background:var(--panel)!important}
  .topbar .brand span{color:var(--muted);font-weight:400;letter-spacing:.05em;margin-left:6px}
  .topbar .clock{color:var(--green);font-weight:600;margin-left:auto}
  .topbar .clock .label{color:var(--muted);margin-right:6px;font-weight:400}
  .topbar .live{color:var(--green);display:inline-flex;align-items:center;gap:5px}
  .topbar .live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  /* ── View tabs ────────────────────────────────────────────── */
  .tabs{background:#050505;border-bottom:1px solid var(--border-bright);padding:0 12px;display:flex;gap:0;font-family:'IBM Plex Mono',monospace;font-size:11px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:9px 16px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--amber);border-bottom-color:var(--amber);background:#0a0a0a}
  .tab .count{color:var(--muted);font-weight:400;margin-left:6px}
  .tab.active .count{color:var(--text)}

  /* ── Toolbar ──────────────────────────────────────────────── */
  .toolbar{background:#080808;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;font-size:11px}
  .toolbar input,.toolbar select{background:#000;border:1px solid var(--border-bright);color:var(--text);padding:4px 8px;border-radius:0;font-family:inherit;font-size:11px}
  .toolbar input[type="text"]{width:200px}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--amber);outline:none}
  .toolbar .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .toolbar button{background:none;border:1px solid var(--border-bright);color:var(--muted);padding:4px 10px;font-family:inherit;font-size:11px;cursor:pointer}
  .toolbar button:hover{color:var(--amber);border-color:var(--amber)}
  .toolbar .spacer{margin-left:auto;color:var(--muted)}

  /* ── Stream view ──────────────────────────────────────────── */
  .stream{font-family:'IBM Plex Sans',sans-serif}
  .grp{background:#000;color:var(--amber);padding:14px 12px 4px;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.15em;border-bottom:1px solid var(--border)}
  .row{display:grid;grid-template-columns:54px 76px 1fr 130px;gap:10px;padding:7px 12px;background:var(--row);border-bottom:1px solid var(--border);align-items:start;cursor:pointer;transition:background .08s}
  .row .ticks-col{display:flex;flex-direction:column;gap:2px;padding-top:0}
  .row .ticker-primary{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;color:var(--amber);letter-spacing:.02em;line-height:1.1;cursor:pointer}
  .row .ticker-primary:hover{text-shadow:0 0 6px rgba(255,155,0,.6)}
  .row .ticker-others{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
  .row .ticker-others span{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--muted);background:transparent;border:1px solid var(--border-bright);padding:0 4px;cursor:pointer;font-weight:600}
  .row .ticker-others span:hover{color:var(--amber);border-color:var(--amber-soft)}
  .row:nth-child(even){background:var(--row-alt)}
  .row:hover{background:#1a1a1a}
  .row .time{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:11px;padding-top:1px;white-space:nowrap}
  .row .ticks{display:flex;flex-wrap:wrap;gap:3px;padding-top:1px}
  .row .ticks .t{background:transparent;color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:1px 5px;border:1px solid var(--amber-soft);cursor:pointer}
  .row .ticks .t:hover{background:var(--amber-soft)}
  .row .title{color:var(--bright);font-size:13px;font-weight:500;line-height:1.42;min-width:0;overflow-wrap:break-word}
  .row .title a{color:inherit}
  .row .title a:hover{color:var(--amber);text-decoration:none}
  /* Sentiment color: thin left accent on the row + slight title tint */
  .row.sent-positive{box-shadow:inset 3px 0 0 #2e7d32}
  .row.sent-positive .title a{color:#a6f4b9}
  .row.sent-negative{box-shadow:inset 3px 0 0 #b73a3a}
  .row.sent-negative .title a{color:#ffb8b8}
  .play-row.sent-positive{box-shadow:inset 3px 0 0 #2e7d32}
  .play-row.sent-positive .body .title{color:#a6f4b9}
  .play-row.sent-negative{box-shadow:inset 3px 0 0 #b73a3a}
  .play-row.sent-negative .body .title{color:#ffb8b8}
  .row .meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:right;white-space:nowrap;padding-top:2px}
  .row .meta .typ{display:inline-block;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.05em;padding:0 4px;border:1px solid var(--border-bright);margin-right:4px}
  .row .meta .src{color:var(--muted);font-weight:500}
  .row .summary{grid-column:2 / -1;display:none;color:var(--muted);font-size:12px;padding:6px 0 4px;line-height:1.55;border-top:1px dashed var(--border);margin-top:6px}
  .row.expand .summary{display:block}

  /* Type color codes (Bloomberg-ish) */
  .typ-upgrade{color:var(--green) !important;border-color:#1f5e2e !important}
  .typ-downgrade{color:var(--red) !important;border-color:#5e1f1f !important}
  .typ-analyst{color:var(--cyan) !important;border-color:#1f4d5e !important}
  .typ-earnings{color:var(--yellow) !important;border-color:#5e571f !important}
  .typ-ma{color:var(--magenta) !important;border-color:#5e1f4d !important}
  .typ-fda{color:#5fff9e !important;border-color:#1f5e3e !important}
  .typ-legal{color:#ff7a45 !important;border-color:#5e3e1f !important}
  .typ-guidance{color:var(--yellow) !important;border-color:#5e571f !important}
  .typ-dividend{color:var(--cyan) !important;border-color:#1f4d5e !important}
  .typ-offering{color:#a78bfa !important;border-color:#3e1f5e !important}
  .typ-8k{color:#fbbf24 !important;border-color:#5e441f !important}
  .typ-macro{color:var(--blue) !important;border-color:#1f3e5e !important}
  .typ-press{color:#a78bfa !important;border-color:#3e1f5e !important}
  .typ-filings{color:#fbbf24 !important;border-color:#5e441f !important}

  /* ── In Play view ─────────────────────────────────────────── */
  .play-ticker-bar{background:#080808;color:var(--amber);padding:10px 12px;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:11px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .play-ticker-bar .lbl{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-right:8px}
  .play-ticker-bar .t{color:var(--amber);border:1px solid var(--amber-soft);padding:2px 8px;cursor:pointer;font-weight:700}
  .play-ticker-bar .t:hover{background:var(--amber-soft)}
  .play-ticker-bar .t.active{background:var(--amber);color:#000}
  .play-row{display:grid;grid-template-columns:60px 70px 1fr 90px 110px;gap:10px;padding:7px 12px;background:var(--row);border-bottom:1px solid var(--border);align-items:start;cursor:pointer}
  .play-row:nth-child(even){background:var(--row-alt)}
  .play-row:hover{background:#1a1a1a}
  .play-row .time{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:11px;white-space:nowrap;padding-top:1px}
  .play-row .ticker{font-family:'IBM Plex Mono',monospace;color:var(--amber);font-size:14px;font-weight:700;letter-spacing:.02em;padding-top:0}
  .play-row .multi{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:10px;padding-top:2px}
  .play-row .body{min-width:0}
  .play-row .body .typ{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--border-bright);color:var(--muted);margin-right:6px;display:inline-block}
  .play-row .body .title{color:var(--bright);font-weight:500;font-size:13px;line-height:1.4}
  .play-row .body .title a{color:inherit}
  .play-row .body .title a:hover{color:var(--amber);text-decoration:none}
  .play-row .src{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:right;white-space:nowrap;padding-top:2px}
  .play-row .open{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:right;padding-top:2px}

  /* ── Empty / loading ──────────────────────────────────────── */
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty h2{color:var(--text);font-weight:500;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.1em;text-transform:uppercase}

  @media (max-width:900px){
    .topbar{font-size:10px;gap:8px;padding:5px 10px;flex-wrap:wrap}
    .topbar .brand{font-size:12px}
    .topbar .clock{margin-left:auto;font-size:10px;padding:2px 6px}
    .tabs{padding:0 8px;gap:0}
    .tab{padding:8px 11px;font-size:10.5px}
    .toolbar{padding:6px 10px;gap:6px;flex-wrap:wrap}
    .toolbar input[type="text"]{width:140px;flex:1 1 140px;min-width:120px}
    .toolbar select{font-size:10.5px}
    .toolbar .lbl{font-size:9.5px}
    .toolbar .spacer{flex-basis:100%;margin-left:0;text-align:right;font-size:9px}
  }
  @media (max-width:760px){
    .row{grid-template-columns:48px 64px 1fr;gap:6px;padding:7px 10px}
    .row .meta{grid-column:1 / -1;text-align:left;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start}
    .row .ticker-primary{font-size:13px}
    .row .meta{font-size:10px;text-align:left;display:flex;flex-wrap:wrap;gap:6px}
    .row .meta .typ{margin-right:0}
    .row .title{font-size:12.5px;line-height:1.4}
    .row .summary{font-size:11.5px}
    .play-row{grid-template-columns:48px 60px 1fr;gap:6px;padding:6px 10px}
    .play-row .src,.play-row .open{grid-column:2 / -1;text-align:left}
    .play-row .body .title{font-size:12.5px}
    .play-ticker-bar{padding:8px 10px;font-size:10px}
    .play-ticker-bar .t{padding:1px 6px}
    .grp{font-size:11px;letter-spacing:.1em}
    /* Tooltip — keep on-screen on small viewports */
    body > div[id="nd-tip"]{max-width:88vw !important;font-size:11px !important}
  }
  @media (max-width:480px){
    .topbar .brand span{display:none}
    .tab .count{display:none}
    .row{grid-template-columns:42px 1fr;padding:6px 8px}
    .row .time{font-size:10px}
    .play-row{grid-template-columns:42px 56px 1fr}
  }
</style>
</head>
<body>
<script>
// ?embed=1 — this page running inside another site's tab (regime-desk's News
// view). Only the brand bar is hidden: regime-desk supplies its own header and
// clock, and two stacked topbars read as a bug. The tabs and toolbar stay,
// because the search and filters are the whole reason for embedding this
// rather than maintaining a thinner second copy of it.
//
// Runs here, immediately after <body> opens, so the class is set before the
// topbar is parsed and it never flashes in then out.
(function(){try{
  if(new URLSearchParams(location.search).get('embed')==='1')
    document.body.classList.add('nd-embed');
}catch(e){}})();
</script>

<div class="topbar">
  <span class="brand">NEWS-DESK <span>v0.2 · TERMINAL</span></span>
  <span class="live" id="live">LIVE</span>
  <span class="muted" id="updated" style="color:var(--muted);font-family:'IBM Plex Mono',monospace">—</span>
  <span class="clock"><span class="label">ET</span><span id="clockET">—</span><span class="label" style="margin-left:14px">UTC</span><span id="clock">—</span></span>
</div>

<div class="tabs">
  <button class="tab active" data-view="news" onclick="switchView('news')">NEWS <span class="count" id="count-news">0</span></button>
  <button class="tab" data-view="book" onclick="switchView('book')">MY BOOK <span class="count" id="count-book">0</span></button>
</div>

<div class="toolbar">
  <span class="lbl">Search</span>
  <input type="text" id="search" placeholder="headline / ticker / source" oninput="render()">
  <span class="lbl">Source</span>
  <select id="srcFilter" onchange="render()"><option value="">All</option></select>
  <span class="lbl">Type</span>
  <select id="typeFilter" onchange="render()"><option value="">All</option></select>
  <button onclick="clearFilters()">CLR</button>
  <span class="spacer" id="counts">0 / 0</span>
</div>

<div id="content"></div>

<script>
const STATE = {
  headlines: [],
  generated: null,
  view: 'news',          // 'news' = all headlines · 'book' = filtered to watchlist
  topTickers: [],
  selectedTicker: null,
  watchlist: [],         // persisted set of tickers the user cares about
  watchOnly: false,      // legacy — kept for the URL handoff; ignored in 2-tab world
  holdingsSummary: null, // metadata about the last parsed holdings file
};

/* localStorage helpers — keep user preferences across refreshes */
const LS_KEY = 'nd-prefs-v1';
function _loadPrefs(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(Array.isArray(p.watchlist)) STATE.watchlist = p.watchlist.map(s => String(s).toUpperCase());
    if(typeof p.watchOnly === 'boolean') STATE.watchOnly = p.watchOnly;
    if(p.holdingsSummary) STATE.holdingsSummary = p.holdingsSummary;
    // Note: STATE.view is NOT restored — page always lands on NEWS by default.
    // BOOK is one click away if you've loaded a holdings file.
  }catch(e){ console && console.warn && console.warn('prefs load:', e); }
}
function _savePrefs(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      watchlist: STATE.watchlist,
      watchOnly: STATE.watchOnly,
      holdingsSummary: STATE.holdingsSummary,
    }));
  }catch(e){}
}
_loadPrefs();

function tick(){
  const now=new Date();
  const hh=String(now.getUTCHours()).padStart(2,'0');
  const mm=String(now.getUTCMinutes()).padStart(2,'0');
  const ss=String(now.getUTCSeconds()).padStart(2,'0');
  const el=document.getElementById('clock');
  if(el) el.textContent=`${hh}:${mm}:${ss}`;
  // ET (America/New_York — handles EDT/EST automatically)
  const etEl=document.getElementById('clockET');
  if(etEl){
    const et=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
    etEl.textContent=et;
  }
}

function fmtTime(iso){
  if(!iso) return '';
  const d=new Date(iso);
  if(isNaN(d)) return iso;
  const now=new Date();
  const diffMin=(now-d)/60000;
  const hh=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  if(diffMin<1) return {hh, rel:'NOW'};
  if(diffMin<60) return {hh, rel:Math.floor(diffMin)+'M'};
  if(diffMin<60*8) return {hh, rel:Math.floor(diffMin/60)+'H'};
  return {hh, rel:d.toLocaleDateString('en-US',{month:'numeric',day:'numeric'})};
}

function fmtUpdated(iso){
  if(!iso) return 'NO DATA';
  const d=new Date(iso);
  const diff=(new Date()-d)/1000;
  if(diff<60) return 'JUST NOW';
  if(diff<3600) return Math.floor(diff/60)+'M AGO';
  return d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'UTC'})+' UTC';
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function groupKey(iso){
  if(!iso) return '';
  const d=new Date(iso);
  const today=new Date(); today.setUTCHours(0,0,0,0);
  const yest=new Date(today); yest.setUTCDate(yest.getUTCDate()-1);
  const dStart=new Date(d); dStart.setUTCHours(0,0,0,0);
  if(dStart.getTime()===today.getTime()) return 'TODAY';
  if(dStart.getTime()===yest.getTime()) return 'YESTERDAY';
  return d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'}).toUpperCase();
}

function computeTopTickers(headlines, n=20){
  const map = {};
  headlines.forEach(h => (h.tickers||[]).forEach(t => { map[t] = (map[t]||0)+1; }));
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
}

function applyFilters(headlines){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const src=document.getElementById('srcFilter').value;
  const typ=document.getElementById('typeFilter').value;

  return headlines.filter(h=>{
    if(src && h.source!==src) return false;
    if(typ && h.type!==typ) return false;
    if(STATE.selectedTicker && !(h.tickers||[]).includes(STATE.selectedTicker)) return false;
    if(q){
      const hay=(h.title+' '+(h.summary||'')+' '+(h.tickers||[]).join(' ')+' '+h.source).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderStream(list){
  // Only show headlines that have at least one extracted ticker.
  // Anything we couldn't confidently tag is dropped.
  const filtered = list.filter(h => (h.tickers||[]).length > 0);
  if(!filtered.length) return '<div class="empty"><h2>NO TICKER-TAGGED HEADLINES</h2><div>The current filter set has no stories with extracted tickers. Try clearing filters or check back after the next refresh.</div></div>';
  let html='<div class="stream">';
  let curGroup=null;
  filtered.forEach(h=>{
    const g=groupKey(h.published);
    if(g!==curGroup){curGroup=g;html+=`<div class="grp">${g}</div>`;}
    const t=fmtTime(h.published);
    const tickers = h.tickers || [];
    const primary = tickers[0];
    const others  = tickers.slice(1);
    const ticksHtml = `<div class="ticker-primary" data-ticker="${primary}" onclick="event.stopPropagation();tickerClick(event,'${primary}')">${primary}</div>`
      + (others.length ? `<div class="ticker-others">${others.map(tk => `<span data-ticker="${tk}" onclick="event.stopPropagation();tickerClick(event,'${tk}')">${tk}</span>`).join(' ')}</div>` : '');
    const typ=h.type||'news';
    html+=`<div class="row sent-${h.sentiment||'neutral'}" onclick="this.classList.toggle('expand')">
      <div class="time">${t.hh}<br><span style="color:var(--dim);font-size:10px">${t.rel||''}</span></div>
      <div class="ticks-col">${ticksHtml}</div>
      <div class="title"><a href="${escapeHtml(h.link)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${escapeHtml(h.title)}</a>${h.summary?`<div class="summary">${escapeHtml(h.summary)}</div>`:''}</div>
      <div class="meta"><span class="typ typ-${typ}">${typ}</span><br><span class="src">${escapeHtml(h.source)}</span></div>
    </div>`;
  });
  html+='</div>';
  return html;
}

function renderInPlay(list){
  // Only headlines with tickers; sorted by recency
  const filtered = list.filter(h => (h.tickers||[]).length > 0);
  // Top-ticker quick-filter bar
  const top = computeTopTickers(filtered, 20);
  const bar = `<div class="play-ticker-bar"><span class="lbl">Most Active</span>${top.map(([t,c])=>`<span class="t ${STATE.selectedTicker===t?'active':''}" onclick="pickTicker('${t}')">${t} <span style="opacity:.6;font-weight:400">${c}</span></span>`).join('')}${STATE.selectedTicker?` <button onclick="pickTicker(null)" style="background:none;border:1px solid var(--amber);color:var(--amber);padding:2px 8px;font-family:inherit;font-size:11px;cursor:pointer;margin-left:8px">✕ ${STATE.selectedTicker}</button>`:''}</div>`;

  if(!filtered.length) return bar + '<div class="empty"><h2>NO ACTIVE TICKERS</h2><div>No ticker-tagged headlines match your filters</div></div>';

  let html=bar+'<div>';
  let curGroup=null;
  filtered.forEach(h=>{
    const g=groupKey(h.published);
    if(g!==curGroup){curGroup=g;html+=`<div class="grp">${g}</div>`;}
    const t=fmtTime(h.published);
    const primary=h.tickers[0];
    const others=h.tickers.slice(1);
    const typ=h.type||'news';
    html+=`<div class="play-row sent-${h.sentiment||'neutral'}" onclick="window.open('${escapeHtml(h.link)}','_blank')">
      <div class="time">${t.hh}<br><span style="color:var(--dim);font-size:10px">${t.rel||''}</span></div>
      <div>
        <div class="ticker" data-ticker="${primary}" onclick="event.stopPropagation();tickerClick(event,'${primary}')">${primary}</div>
        ${others.length?`<div class="multi">${others.map(tk=>`<span data-ticker="${tk}" style="cursor:pointer" onclick="event.stopPropagation();tickerClick(event,'${tk}')">${tk}</span>`).join(' ')}</div>`:''}
      </div>
      <div class="body"><span class="typ typ-${typ}">${typ}</span><span class="title">${escapeHtml(h.title)}</span></div>
      <div class="src">${escapeHtml(h.source)}</div>
      <div class="open"><a href="${escapeHtml(h.link)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" style="color:var(--muted)">OPEN ↗</a></div>
    </div>`;
  });
  html+='</div>';
  return html;

/* Flexible column matchers — same idea as FINvisible's loaders.py */
const _HLD_SYM_HEADERS = [
  'symbol / cusip / id','symbol / cusip','symbol','ticker','security id','cusip'
];

function _findSymbolColumn(headers){
  const norm = headers.map(h => String(h||'').trim().toLowerCase());
  for(const want of _HLD_SYM_HEADERS){
    for(let i=0;i<norm.length;i++){
      if(norm[i] === want || norm[i].includes(want)) return {idx:i, label:headers[i]};
    }
  }
  return null;
}

/* Accept the same shapes Python's normalize.looks_like_ticker accepts */
const _TICKER_RE = /^[A-Z]{1,5}(?:\.[A-Z]{1,2})?$/;
const _CASH_LIKE = new Set(['CASH','USD','MMF','SPAXX','VMFXX','SWVXX','FDRXX','FZFXX','VMRXX','SNSXX','MM','SWEEP','BANKDEP','INSURED','9999136']);

function _parseHoldings(file){
  if(typeof XLSX === 'undefined'){
    alert('SheetJS still loading, try again in a moment.');
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = new Uint8Array(ev.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      // Find the header row — try the first row with >= 4 useful cells
      let headerIdx = 0;
      for(let i=0;i<Math.min(rows.length,6);i++){
        const non = rows[i].filter(v => String(v||'').trim().length > 0).length;
        if(non >= 4){ headerIdx = i; break; }
      }
      const headers = rows[headerIdx] || [];
      const dataRows = rows.slice(headerIdx + 1);
      const symCol = _findSymbolColumn(headers);
      if(!symCol){
        STATE.holdingsSummary = { filename:file.name, rowCount:dataRows.length, symCol:null, tickerCount:0, skipped:dataRows.length, error:'No Symbol-like column found' };
        render();
        return;
      }
      const seen = new Set();
      let skipped = 0;
      for(const r of dataRows){
        const raw = r[symCol.idx];
        const tk = String(raw||'').trim().toUpperCase().replace(/\s+/g,'');
        if(!tk){ continue; }
        if(_CASH_LIKE.has(tk)){ skipped++; continue; }
        if(!_TICKER_RE.test(tk)){ skipped++; continue; }
        seen.add(tk);
      }
      STATE.watchlist = [...seen].sort();
      STATE.watchOnly = STATE.watchlist.length > 0;
      STATE.holdingsSummary = {
        filename: file.name,
        rowCount: dataRows.length,
        symCol:   symCol.label,
        tickerCount: STATE.watchlist.length,
        skipped: skipped,
      };
      _savePrefs();
      _renderWatchUI();
      render();
    } catch(err){
      STATE.holdingsSummary = { filename:file.name, rowCount:0, error:String(err) };
      render();
    }
  };
  reader.readAsArrayBuffer(file);
}

/* URL params:
 *   ?ticker=AAPL          → search-box filter on that ticker (inbound from regime-desk)
 *   ?watchlist=AAPL,MSFT  → REPLACES the saved book and switches to BOOK tab
 *   ?watchadd=AAPL,MSFT   → APPENDS to the saved book without switching tabs
 */
(function applyUrlParams(){
  const params = new URLSearchParams(window.location.search);

  const wlReplace = params.get('watchlist');
  const wlAdd     = params.get('watchadd');
  if(wlReplace !== null){
    STATE.watchlist = wlReplace.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
    STATE.holdingsSummary = { filename: 'URL handoff (' + STATE.watchlist.length + ' tickers)' };
    STATE.view = 'book';
    _savePrefs(); _renderWatchUI();
  } else if(wlAdd){
    const additions = wlAdd.split(',').map(s => s.trim().toUpperCase()).filter(Boolean);
    additions.forEach(tk => { if(!STATE.watchlist.includes(tk)) STATE.watchlist.push(tk); });
    _savePrefs(); _renderWatchUI();
  }

  const t = (params.get('ticker') || '').toUpperCase().trim();
  if(!t && !(wlReplace !== null || wlAdd)) return;

  const tryApply = () => {
    if(!STATE.headlines.length) return setTimeout(tryApply, 200);
    if(t){
      const s = document.getElementById('search');
      if(s){ s.value = t; }
    }
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view===STATE.view));
    render();
    if(history.replaceState){
      history.replaceState(null, '', location.pathname + location.hash);
    }
  };
  tryApply();
})();

/* ── Ticker hover tooltip (regime-desk style) ──────────────────────────── */
(function(){
  const tip = document.createElement('div');
  tip.id = 'nd-tip';
  Object.assign(tip.style, {
    position:'fixed', zIndex:'500', display:'none', pointerEvents:'none',
    background:'#0a0a0a', border:'1px solid var(--amber)',
    boxShadow:'0 8px 24px rgba(0,0,0,.7), 0 0 18px rgba(255,155,0,.18)',
    color:'var(--text)', padding:'10px 12px', maxWidth:'320px',
    fontFamily:'IBM Plex Sans, sans-serif', fontSize:'12px', lineHeight:'1.5',
    borderRadius:'2px',
  });
  document.body.appendChild(tip);
  let _cx=0,_cy=0;

  function pos(cx,cy){
    const tw=tip.offsetWidth||260, th=tip.offsetHeight||140;
    let lx=cx+14, ly=cy+14;
    if(lx+tw > window.innerWidth-8) lx = cx-tw-14;
    if(ly+th > window.innerHeight-8) ly = cy-th-14;
    tip.style.left=lx+'px'; tip.style.top=ly+'px';
  }

  function relTime(iso){
    if(!iso) return '';
    const d=new Date(iso), diff=(new Date()-d)/60000;
    if(diff<1) return 'just now';
    if(diff<60) return Math.floor(diff)+'m ago';
    if(diff<60*24) return Math.floor(diff/60)+'h ago';
    return Math.floor(diff/(60*24))+'d ago';
  }

  function sparkSVG(closes){
    if(!closes || closes.length<2) return '';
    const W=238, H=34;
    const mn=Math.min(...closes), mx=Math.max(...closes), rng=(mx-mn)||1, n=closes.length;
    const pts = closes.map((v,i) => `${((i/(n-1))*W).toFixed(1)},${(H-2-((v-mn)/rng)*(H-6)).toFixed(1)}`).join(' ');
    const col = closes[closes.length-1] >= closes[0] ? '#3fb950' : '#f85149';
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;margin-top:5px;overflow:visible">
      <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  function priceBlock(ticker){
    const s = (STATE.stocks||{})[ticker];
    if(!s) return '';
    const pc = s.change_pct >= 0 ? '#3fb950' : '#f85149';
    const sign = s.change_pct >= 0 ? '+' : '';
    const wkLow = s.wk_low, wkHigh = s.wk_high;
    const wkRng = (wkHigh - wkLow) || 1;
    const wkPos = Math.max(0, Math.min(100, ((s.price - wkLow) / wkRng) * 100));
    const rangeBar = `<div style="margin-top:6px">
      <div style="display:flex;justify-content:space-between;color:#6e7681;font-size:9px;margin-bottom:2px;font-family:IBM Plex Mono,monospace">
        <span>$${wkLow.toFixed(2)}</span>
        <span style="color:#484f58">7d range</span>
        <span>$${wkHigh.toFixed(2)}</span>
      </div>
      <div style="position:relative;height:4px;background:#1c1c1c;border-radius:2px">
        <div style="position:absolute;left:${wkPos.toFixed(0)}%;top:-2px;width:2px;height:8px;background:${pc};transform:translateX(-1px);border-radius:1px"></div>
      </div>
    </div>`;
    return `<div style="border-top:1px solid #1c1c1c;border-bottom:1px solid #1c1c1c;margin:8px 0;padding:6px 0">
      <div style="display:flex;align-items:baseline;gap:8px;font-family:IBM Plex Mono,monospace">
        <span style="color:#f0f6fc;font-size:16px;font-weight:700">$${s.price.toFixed(2)}</span>
        <span style="color:${pc};font-size:12px;font-weight:700">${sign}${s.change_pct.toFixed(2)}%</span>
        <span style="color:#484f58;font-size:10px;letter-spacing:.05em">TODAY</span>
      </div>
      ${sparkSVG(s.week_closes)}
      ${rangeBar}
    </div>`;
  }

  function show(ticker, cx, cy){
    _cx=cx; _cy=cy;
    const headlines = (STATE.headlines||[]).filter(h => (h.tickers||[]).includes(ticker));
    const name = (STATE.tickerNames||{})[ticker] || '';
    const recent = headlines.slice(0, 3);
    const total = headlines.length;
    const latest = headlines[0];
    const typeCounts = {};
    headlines.forEach(h => { const t=h.type||'news'; typeCounts[t]=(typeCounts[t]||0)+1; });
    const topTypes = Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);

    const recentList = recent.map(h => {
      const t = h.type || 'news';
      return `<div style="border-top:1px solid #1c1c1c;padding-top:6px;margin-top:6px">
        <div style="color:var(--muted);font-size:10px;font-family:IBM Plex Mono,monospace;margin-bottom:2px">${escapeHtml(h.source)} · ${relTime(h.published)}</div>
        <div style="color:var(--text);font-size:12px;line-height:1.4">${escapeHtml(h.title.length>90?h.title.slice(0,90)+'…':h.title)}</div>
      </div>`;
    }).join('');

    const typeChips = topTypes.length
      ? '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">'+
          topTypes.map(([t,c])=>`<span style="font-family:IBM Plex Mono,monospace;font-size:9px;color:var(--muted);background:#181818;padding:1px 5px;border:1px solid #2a2a2a;letter-spacing:.05em;text-transform:uppercase">${t} ${c}</span>`).join('')+
        '</div>'
      : '';

    tip.innerHTML = ''+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">'+
        `<img src="https://assets.parqet.com/logos/symbol/${ticker}?format=jpg" width="26" height="26" `+
        `style="border-radius:3px;background:#fff;border:1px solid #2a2a2a;object-fit:contain;flex-shrink:0" `+
        `onerror="this.style.display='none'" loading="lazy">`+
        `<strong style="color:var(--amber);font-family:IBM Plex Mono,monospace;font-size:16px;letter-spacing:.04em">${ticker}</strong>`+
      '</div>'+
      (name ? `<div style="color:var(--muted);font-size:11px;margin-bottom:4px">${escapeHtml(name)}</div>` : '')+
      priceBlock(ticker)+
      `<div style="color:var(--text);font-size:11px;font-family:IBM Plex Mono,monospace"><strong style="color:var(--amber)">${total}</strong> headline${total===1?'':'s'} in feed</div>`+
      typeChips+
      recentList+
      '<div style="margin-top:8px;color:var(--muted);font-size:10px;font-family:IBM Plex Mono,monospace;letter-spacing:.06em;text-transform:uppercase;line-height:1.55">'+
        '<div>click → filter feed</div>'+
        '<div style="color:#58a6ff">shift-click → regime-desk ↗</div>'+
      '</div>';

    pos(cx, cy);
    tip.style.display = 'block';
  }

  function hide(){ tip.style.display='none'; }

  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[data-ticker]');
    if(el && el.dataset.ticker) show(el.dataset.ticker, e.clientX, e.clientY);
    else hide();
  });
  document.addEventListener('mousemove', e => {
    _cx=e.clientX; _cy=e.clientY;
    if(tip.style.display==='block') pos(_cx, _cy);
  });
  document.addEventListener('mouseout', e => {
    const el = e.target.closest && e.target.closest('[data-ticker]');
    if(el && !el.contains(e.relatedTarget)) hide();
  });
})();
</script>
</body>
</html>
